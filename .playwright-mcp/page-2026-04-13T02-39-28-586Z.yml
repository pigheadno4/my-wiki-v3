            - button "Step 3. Render the PayPal buttons After setting up the SDK for your website, you need to render the buttons. The paypal namespace has a Buttons function that initiates the callbacks needed to set up a payment. The createOrder callback launches when the customer clicks the payment button. The callback starts the order and returns an order ID. After the customer checks out using the PayPal pop-up, this order ID helps you to confirm when the payment is completed. Completing the payment launches an onApprove callback. Use the onApprove response to update business logic, show a celebration page, or handle error responses. If your website handles shipping physical items, this documentation includes details about our shipping callbacks. Canadian merchants typically need to render a site in both English and French. To support this requirement, see Pay Later (CA)." [ref=e428]:
