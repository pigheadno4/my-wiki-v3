# Stable collection intent only. Generated collection state belongs in tracking/github/.

[[repos]]
id="paypal/paypal-messaging-components"
collection_frequency="weekly"
company="paypal"
url="https://github.com/paypal/paypal-messaging-components"
enabled=true
repo_type="web-component"
priority="tier1"
track="releases-and-default-branch"
version_strategy="semver-tags"
ingest_required_paths=[
  "README.md",
  "CHANGELOG.md",
  "LICENSE.txt",
  "package.json",
  "__sdk__.js",
  "globals.js",
  "docs",
  "src",
]
[[repos.version_tracks]]
selector="package:@paypal/messaging-components@1"
backfill="latest-stable"
future="all-stable"
include_prerelease=false
[[repos.capsules]]
id="paypal-messaging-components-source"
adapter="tagged-tree-v1"
focus_packages=["@paypal/messaging-components"]
dependency_scope="configured-repository-paths"
changed_path_policy="policy-bounded"
default_required_roots=[
  "src/components/message",
  "src/components/modal/v2/lib",
  "src/library",
  "src/server",
  "src/utils",
  "content",
]
default_generated_target_paths=[]
include_paths=[
  "README.md",
  "CHANGELOG.md",
  "LICENSE.txt",
  "package.json",
  "__sdk__.js",
  "globals.js",
  "paypal.dev.js",
  "src/components/modal/v2/index.js",
  "src/components/modal/v2/parts/BodyContent.jsx",
  "src/components/modal/v2/parts/Button.jsx",
  "src/components/modal/v2/parts/Calculator.jsx",
  "src/components/modal/v2/parts/CheckoutHeader.jsx",
  "src/components/modal/v2/parts/Container.jsx",
  "src/components/modal/v2/parts/Donut.jsx",
  "src/components/modal/v2/parts/ErrorBoundary.jsx",
  "src/components/modal/v2/parts/Header.jsx",
  "src/components/modal/v2/parts/Icon.jsx",
  "src/components/modal/v2/parts/InlineLinks.jsx",
  "src/components/modal/v2/parts/Instructions.jsx",
  "src/components/modal/v2/parts/LoadingShimmer.jsx",
  "src/components/modal/v2/parts/Modal.jsx",
  "src/components/modal/v2/parts/OfferAccordion.jsx",
  "src/components/modal/v2/parts/OfferCard.jsx",
  "src/components/modal/v2/parts/OfferTerms.jsx",
  "src/components/modal/v2/parts/Overlay.jsx",
  "src/components/modal/v2/parts/PreapprovalDisclaimer.jsx",
  "src/components/modal/v2/parts/ProductListLink.jsx",
  "src/components/modal/v2/parts/TermsTable.jsx",
  "src/components/modal/v2/parts/Tile.jsx",
  "src/components/modal/v2/parts/views/LongTerm/Content.jsx",
  "src/components/modal/v2/parts/views/NoInterest/Content.jsx",
