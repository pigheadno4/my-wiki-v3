# Stable collection intent only. Generated collection state belongs in tracking/github/.

[[repos]]
id="paypal/paypal-messaging-components"
collection_frequency="weekly"
company="paypal"
url="https://github.com/paypal/paypal-messaging-components"
enabled=false
repo_type="web-component"
priority="tier1"
track="releases-and-default-branch"
version_strategy="semver-tags"
[[repos]]
id="paypal/paypal-checkout-components"
collection_frequency="weekly"
company="paypal"
url="https://github.com/paypal/paypal-checkout-components"
enabled=false
repo_type="web-component"
priority="tier1"
track="releases-and-default-branch"
version_strategy="semver-tags"
[[repos]]
id="paypal/paypal-android"
collection_frequency="weekly"
company="paypal"
url="https://github.com/paypal/paypal-android"
enabled=false
repo_type="mobile-sdk"
priority="tier1"
track="releases-and-default-branch"
version_strategy="semver-tags"
[[repos]]
id="paypal/paypal-sdk-release"
collection_frequency="monthly"
company="paypal"
url="https://github.com/paypal/paypal-sdk-release"
enabled=false
repo_type="release-index"
priority="tier2"
track="releases-and-default-branch"
version_strategy="github-release"
[[repos]]
id="paypal/paypal-js"
collection_frequency="weekly"
company="paypal"
url="https://github.com/paypal/paypal-js"
enabled=true
repo_type="web-sdk"
priority="tier1"
track="releases-and-default-branch"
version_strategy="monorepo-packages"
[[repos.version_tracks]]
selector="package:@paypal/paypal-js@8"
backfill="latest-stable"
future="none"
include_prerelease=false
[[repos.version_tracks]]
selector="package:@paypal/paypal-js@9"
backfill="latest-stable"
future="none"
include_prerelease=false
[[repos.version_tracks]]
selector="package:@paypal/paypal-js@10"
backfill="all-stable"
future="all-stable"
include_prerelease=false
[[repos.version_tracks]]
selector="package:@paypal/react-paypal-js@8"
backfill="latest-stable"
future="none"
include_prerelease=false
[[repos.version_tracks]]
selector="package:@paypal/react-paypal-js@9"
backfill="latest-stable"
future="none"
include_prerelease=false
[[repos.version_tracks]]
selector="package:@paypal/react-paypal-js@10"
backfill="all-stable"
future="all-stable"
include_prerelease=false
[[repos.capsules]]
id="paypal-js-public-source"
adapter="npm-tracked-source-v1"
focus_packages=["@paypal/paypal-js", "@paypal/react-paypal-js"]
dependency_scope="internal-runtime-closure"
default_required_roots=["src"]
default_generated_target_paths=["dist/"]
include_paths=[]
excluded_categories=["tests", "fixtures"]
secret_detector="text-secrets-v1"
max_file_bytes=512000
max_capsule_files=240
max_capsule_utf8_bytes=1500000
max_packet_files=280
max_packet_utf8_bytes=1800000
